name: ARM64 Peterson Test

on:
  workflow_dispatch:
  push:

jobs:
  arm64-test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show ARM CPU
        run: |
          uname -m
          lscpu

      - name: Compile
        run: |
          g++ -O0 -std=c++20 -pthread test.cpp -o test_O0
          g++ -O3 -std=c++20 -pthread test.cpp -o test_O3

      - name: Run O0
        run: |
          echo "===== O0 ====="
          for i in {1..5}; do ./test_O0; done

      - name: Run O3
        run: |
          echo "===== O3 ====="
          for i in {1..5}; do ./test_O0; done
